<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASE Cursos Profissionalizantes</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f5fa;
    color: #222;
}

header {
    background: #102a56;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    font-size: 25px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    background: #fff;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    background: #155eef;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000010;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

h2 {
    margin-bottom: 18px;
    color: #102a56;
}

h3 {
    margin-bottom: 10px;
}

.price {
    color: #128044;
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

footer {
    background: #102a56;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}

.certificate {
    border: 8px double #102a56;
    background: white;
    padding: 35px;
    text-align: center;
    margin-top: 20px;
}

.certificate h1 {
    color: #102a56;
    margin-bottom: 25px;
}

.small {
    font-size: 13px;
    color: #666;
}

@media print {
    body * {
        visibility: hidden;
    }

    #certificate, #certificate * {
        visibility: visible;
    }

    #certificate {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .no-print {
        display: none !important;
    }
}
</style>
</head>

<body>

<header>
    <h1>ASE Cursos Profissionalizantes</h1>
    <p>Aprenda, conquiste seu certificado e transforme seu futuro!</p>
</header>

<nav class="no-print">
    <button onclick="showSection('home')">Início</button>
    <button onclick="showSection('courses')">Cursos</button>
    <button onclick="showSection('student')">Área do Aluno</button>
